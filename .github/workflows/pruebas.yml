name: Pruebas en emulador (fase 2)

# Solo en la rama de pruebas: compila la app en modo de pruebas (sin firmar, no se publica nada), la arranca en un
# emulador de Android y guarda capturas y registros.
on:
  push:
    branches: [ fase2 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pruebas-fase2
  cancel-in-progress: true

jobs:
  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      # (las piezas para compilar, guardadas de una vez para otra: menos descargas, y no depender de que Maven Central
      # conteste —a veces dice «demasiadas peticiones»—)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'scripts/prepare-android.mjs') }}
          restore-keys: gradle-
      # (solo para las pruebas: el cerebro de comprensión de Nova, el mismo que se instala en el móvil desde Ajustes)
      - uses: actions/cache@v4
        with:
          path: pruebas/cerebro
          key: cerebro-e5-small-q-ort118-v1
      - name: Dependencias
        timeout-minutes: 8
        run: npm install --no-audit --no-fund
      # (para fabricar la música de prueba; si los servidores de Ubuntu van lentos, se baja el de npm)
      - name: ffmpeg
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg > /dev/null; then
            (timeout 150 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=1 update -qq && timeout 180 sudo apt-get -o Acquire::http::Timeout=20 install -y -qq ffmpeg > /dev/null) || true
          fi
          if ! command -v ffmpeg > /dev/null; then
            mkdir -p "$RUNNER_TEMP/ff" && cd "$RUNNER_TEMP/ff" && npm init -y > /dev/null && npm install --no-audit --no-fund ffmpeg-static > /dev/null
            echo "$(dirname "$(node -p "require('ffmpeg-static')")")" >> "$GITHUB_PATH"
          fi
      - name: Proyecto Android
        env:
          BUILD_NUMBER: 9${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
      - name: Compilar (pruebas)
        run: |
          mkdir -p salida
          cd android && chmod +x gradlew
          set -o pipefail
          # (si el servidor de descargas dice «demasiadas peticiones» o no contesta, otra vez al minuto; un error de verdad, no)
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../salida/gradle.txt | tail -n 60; then ok=1; break; fi
            grep -qE "status code (429|5[0-9][0-9])|Could not GET|Read timed out|Connection reset" ../salida/gradle.txt || break
            echo "(descargas: otra vez en 60 s)"; sleep 60
          done
          [ $ok = 1 ]
      # (solo para las pruebas: un reconocimiento de voz de mentira, con guion, para probar «Háblale» en el emulador; no
      # va en la app)
      - name: Voz de prueba
        continue-on-error: true
        run: |
          set -o pipefail
          sh pruebas/voz/hacer.sh pruebas/voz/voz-de-prueba.apk 2>&1 | tee salida/voz.txt
      - name: Cerebro de prueba
        continue-on-error: true
        run: |
          mkdir -p pruebas/cerebro salida && cd pruebas/cerebro
          get() { if [ ! -s "$1" ]; then curl -fsSL --retry 3 --retry-delay 5 -o "$1.tmp" "$2" && mv "$1.tmp" "$1"; fi; }
          {
            get tokenizer.json https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/tokenizer.json
            get modelo.onnx https://huggingface.co/Xenova/multilingual-e5-small/resolve/main/onnx/model_quantized.onnx
            get ort.wasm.min.js https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.wasm.min.js || get ort.wasm.min.js https://unpkg.com/onnxruntime-web@1.18.0/dist/ort.wasm.min.js
            get ort-wasm-simd.wasm https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort-wasm-simd.wasm || get ort-wasm-simd.wasm https://unpkg.com/onnxruntime-web@1.18.0/dist/ort-wasm-simd.wasm
            ls -la
          } 2>&1 | tee ../../salida/cerebro.txt
      # Lo mismo que compila la versión que se publica (sin firmar): que no falle por algo que solo salga ahí
      - name: Compilar como la versión publicada
        if: hashFiles('pruebas/solo-ventanas') == '' && hashFiles('pruebas/solo-viz') == '' && hashFiles('pruebas/solo-letra') == '' && hashFiles('pruebas/solo-voz') == '' && hashFiles('pruebas/solo-cerebro') == '' && hashFiles('pruebas/solo-base') == ''
        run: |
          cd android
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../salida/gradle-release.txt | tail -n 30; then ok=1; break; fi
            grep -qE "status code (429|5[0-9][0-9])|Could not GET|Read timed out|Connection reset" ../salida/gradle-release.txt || break
            echo "(descargas: otra vez en 60 s)"; sleep 60
          done
          [ $ok = 1 ]
      - name: Errores de compilación
        if: failure()
        run: |
          cat salida/gradle.txt salida/gradle-release.txt 2>/dev/null | grep -nE "^e: |error:|FAILED|What went wrong" -A3 | head -n 120 > salida/errores.txt || true
      # (lo que deja la compilación encendido se apaga: el emulador necesita esa memoria)
      - name: Memoria
        run: |
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          sleep 2; free -m
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 3072M
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node pruebas/emu.mjs
      # si el emulador se cierra solo, aquí queda por qué (memoria del ordenador de las pruebas)
      - name: Memoria al final
        if: always()
        run: |
          mkdir -p salida
          { free -m; sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process|oom|segfault|qemu" | tail -n 40; } > salida/memoria.txt || true
          cat salida/memoria.txt
      # Los resultados (capturas y registros) van a la rama «resultados», que se sobrescribe en cada prueba
      - name: Publicar resultados
        if: always()
        run: |
          mkdir -p salida && cd salida
          echo "prueba ${{ github.run_number }} · ${{ github.sha }}" > LEEME.txt
          git init -q -b resultados
          git add -A
          git -c user.name="pruebas" -c user.email="pruebas@users.noreply.github.com" commit -qm "Resultados de la prueba ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultados
