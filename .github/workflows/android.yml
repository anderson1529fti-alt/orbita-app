name: Construir app Android

# Se ejecuta solo cada vez que subes cambios a la rama main,
# y también a mano desde la pestaña Actions (botón "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    # Ubuntu 24.04 fijo: «ubuntu-latest» está cambiando a Ubuntu 26 y trae otras herramientas de Android
    # 3.6: las acciones van con Node 24 (checkout v5, setup-node v5, setup-java v5, setup-android v4, gh-release v3):
    # ya no sale el aviso de «Node.js 20 está obsoleto»
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Comprobar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD. Sigue la PARTE 2 de LEEME.txt."
            exit 1
          fi

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Sin el paquete antiguo «tools», que Google ya no ofrece (por defecto lo pedía y fallaba)
          packages: 'platform-tools'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      # El cerebro grande de Nova usa llama.cpp. Se descarga siempre la misma versión (la probada con la app)
      # y se comprueba que el archivo es exactamente ese. Si fallara, la app se compila sin el cerebro grande.
      - name: Código del cerebro grande (llama.cpp)
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/llama/src"
          curl -fsSL -o "$RUNNER_TEMP/llama/src.tar.gz" https://files.pythonhosted.org/packages/source/l/llama_cpp_python/llama_cpp_python-0.3.16.tar.gz
          echo "34ed0f9bd9431af045bb63d9324ae620ad0536653740e9bb163a2e1fcb973be6  $RUNNER_TEMP/llama/src.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llama/src.tar.gz" -C "$RUNNER_TEMP/llama/src" llama_cpp_python-0.3.16/vendor/llama.cpp
          echo "LLAMA_DIR=$RUNNER_TEMP/llama/src/llama_cpp_python-0.3.16/vendor/llama.cpp" >> "$GITHUB_ENV"

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Icono, permisos, versión y firma
        id: prep
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: node scripts/prepare-android.mjs

      - name: Copiar la app al proyecto
        run: npx cap sync android

      - name: Compilar el APK
        id: build
        continue-on-error: true
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Plan A1b (4.2): si el reproductor nuevo (Kotlin con Media3) no compila, se compila con el de la 4.1 (Java).
      # Todo lo demás de la versión va dentro igual.
      - name: Compilar con el reproductor de la 4.1 (plan A1b)
        id: build14
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAYER: 'java'
        run: |
          echo "::warning::El reproductor nuevo (Kotlin) no compiló; se publica la versión con el reproductor de la 4.1."
          rm -rf android
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Plan A2: si lo nuevo de Android de la 3.5 (el motor de sonido y el despertador) no compila, se vuelve a
      # compilar sin ello. El cerebro grande y todo lo demás siguen dentro.
      - name: Compilar sin el motor de sonido ni el despertador (plan A2)
        id: build15
        if: steps.build.outcome == 'failure' && steps.build14.outcome == 'failure'
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NATIVEAUDIO: '0'
          ALARM: '0'
        run: |
          echo "::warning::La compilación completa falló; se publica la versión sin el motor de sonido de Android ni el despertador."
          rm -rf android
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Plan B: si el cerebro grande no compila, se vuelve a compilar sin él (todo lo demás sigue igual).
      - name: Compilar sin el cerebro grande (plan B)
        id: build2
        if: steps.build.outcome == 'failure' && steps.build14.outcome == 'failure' && steps.build15.outcome == 'failure'
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BIGBRAIN: '0'
        run: |
          echo "::warning::La compilación completa falló; se publica la versión sin el cerebro grande."
          rm -rf android
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Plan C: si aun así algo del lado de Android no compila, se vuelve a compilar sin el widget
      # ni «Compartir con Órbita». La app y todo lo demás de la versión se publican igual.
      - name: Compilar sin el widget (plan C)
        if: steps.build.outcome == 'failure' && steps.build14.outcome == 'failure' && steps.build15.outcome == 'failure' && steps.build2.outcome == 'failure'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXTRAS: '0'
        run: |
          echo "::warning::La compilación completa falló; se publica la versión sin widget ni «Compartir con Órbita»."
          rm -rf android
          npx cap add android
          node scripts/prepare-android.mjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Orbita-${{ steps.prep.outputs.version }}.apk"

      - name: Publicar la versión (Releases)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: "Órbita ${{ steps.prep.outputs.version }}${{ steps.prep.outputs.prerelease == 'true' && ' (beta)' || '' }}"
          body_path: NOVEDADES.txt
          files: Orbita-${{ steps.prep.outputs.version }}.apk
          # Las betas quedan en Releases para instalarlas a mano, pero no avisan a los usuarios
          prerelease: ${{ steps.prep.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.prep.outputs.prerelease != 'true' }}
