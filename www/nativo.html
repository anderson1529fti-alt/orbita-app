<script>
/* Fase 4, parte 2 · Órbita sin la parte web: todo lo hace Android. Esta página solo lo enciende (y deja a las pruebas
   preguntarle a Android cómo va). */
(async () => {
  for (let k = 0; k < 50 && !(window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.OrbitaUi); k++) await new Promise(r => setTimeout(r, 100));
  try { window.__nat = await Capacitor.Plugins.OrbitaUi.nativo({}); } catch (e) { window.__natErr = String(e && e.message || e); }
})();
</script>
